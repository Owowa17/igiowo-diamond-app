name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' 
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate missing platform folders
        run: flutter create --platforms=android .

      # ✅ Add Internet Permission to Android Manifest
      - name: Add Internet Permission to Android Manifest
        run: |
          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          if '<uses-permission android:name=\"android.permission.INTERNET\" />' not in content:
              content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application')
              with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
                  f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      # ✅ Generate the Custom Igiowo Diamond Logo
      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      # ✅ Build the Final APK
      - name: Build APK
        run: flutter build apk --release

      # ✅ Upload the APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: igiowo-diamond-app
          path: build/app/outputs/flutter-apk/app-release.apk
